<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/79b0d497e2.js" crossorigin="anonymous"></script>
    <title>Name checker</title>
    
 </head>

 <body>

<section id="header">
    <div>
        
    <h1 class="infoHeader">
        Find Your<br>
        <div class="changeCl">Perfect Home.</div>
        Live Your Dream,
        
    </h1>
    <p class="infoPara">
        Premium properties. Trusted agents.<br>
        Hassle-free experience.
    </p>
    <div class="buttonsViEx">
        <button class="exploreBtn">Explore Properties</button>
        <button class="watchVid">
            <i class="fa-solid fa-circle-play"></i>
            Watch Video
        </button>
    </div>
    <div class="happyClients">
        <img src="images/12f8dd715243f835a69fdb1e74f36d91.jpg" alt="" class="image1 imageC">
        <img src="images/55e285483a91e4b10b42d0a143924b58.jpg" alt="" class="image2 imageC">
        <img src="images/22b496b9450cd4e096136e72f3e441ed.jpg" alt="" class="image3 imageC">
        <img src="images/23891e541dfe1d9ef44e69a61d40405d.jpg" alt="" class="image4 imageC">
        <img src="images/27b08e8b6ac2bd34b1c355ea48df6238.jpg" alt="" class="image5 imageC">
    
    <div class="happyHoumeowners">
         <p class="numbersHa">5000+<br>
        Happy Homeowners</p></div>
    </div>
    </div>
    <div class="headerImg">
        <img src="images/—Pngtree—futuristic house with a curved_16140509.png" alt="futuristic house">
    </div>
</section>


<section id="navBar">
    <div class="locationMapSec" id="propBox">
        <i class="fu fa fa-solid fa-location-dot"></i>
        <div class="type">
        <div class="location">Location<br></div>
        <div class="sel selectLocation">Select location<i class="fa-solid fa-angle-down"></i></div>
        </div>
    </div>

    <div class="propertySec" id="propBox">
        <i class="fu fa-solid fa-house"></i>
        <div class="type">
        <div class="propertyType">Property type</div>
        <div class="sel selectType">Select <i class="fa-solid fa-angle-down"></i></div>
        </div>
    </div>

    <div class="budgetSec" id="propBox">
        <i class="fu fa-solid fa-wallet"></i>
        <div class="type">
        <div class="buget">Budget</div>
        <div class="sel selectBudget">Select budget <i class="fa-solid fa-angle-down"></i></div>
        </div>
    </div>

    <div class="searchSec" id="propBox">
        <button class="searchBtn">
        <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <input type="search" placeholder="search" class="searchImput">
    </div>


</section>    


<section id="infoBar">
    <div class="info propertiesCount">
        <i class="fain inf fa-solid fa-building"></i>
        <div class="speed infoAmount"><h1>500+</h1>
        <p class="txt">Properties</p>
    </div>
    </div>
    <div class="info trustedBox">
        <i class="fain inf fa-solid fa-handshake"></i>
        <div class="speed trusted">
            <h1>Trusted</h1>
        <p class="txt">Agents</p>
        </div>
    </div>

    <div class="info bestBox">
        <i class="fain fa-solid fa-ranking-star"></i>
        <div class="speed bestPrice">
            <h1>Best</h1>
        <p class="txt">Price</p>
        </div>
    </div>

    <div class="info fastPocessBox">
        <i class="fain fa-solid fa-gauge-high"></i>
        <div class="speed fastProcess">
            <h1>Fast</h1>
        <p class="txt">Process</p>
        </div>
    </div>
</section>

<section id="productView"></section>

<section id="byType"></section>

<section id="stepsToBuy"></section>

<section id="agents"></section>

<footer id="footer"></footer>

 <script src="script.js"></script>
</body>
</html>
